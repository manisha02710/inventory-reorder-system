<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - StockPredictAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Ambient Background Glows -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-slate-900/90 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl border border-slate-800 w-full max-w-md relative z-10">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-blue-500/20 mx-auto mb-3">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">StockPredict<span class="text-blue-500">AI</span></h1>
            <p class="text-xs text-slate-400 mt-1">Inventory Reorder Intelligence & Demand Forecasting</p>
        </div>

        <!-- Auth Tabs: Sign In / Create Account -->
        <div class="flex p-1 bg-slate-800/80 rounded-xl border border-slate-700/60 mb-6">
            <button type="button" id="tabLogin" onclick="switchAuthTab('login')"
                class="flex-1 py-2 text-xs font-bold rounded-lg text-white bg-blue-600 shadow-sm transition">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Sign In
            </button>
            <button type="button" id="tabRegister" onclick="switchAuthTab('register')"
                class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-user-plus mr-1.5"></i> Create Account
            </button>
        </div>

        <!-- Form (Shared between Login and Register) -->
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="authEmail" name="email" value="admin@example.com" required
                        placeholder="yourname@company.com"
                        class="w-full bg-slate-800/90 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="authPassword" name="password" value="admin123" required
                        placeholder="••••••••"
                        class="w-full bg-slate-800/90 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <p id="passwordHint" class="text-[11px] text-slate-500 mt-1 hidden">Must be at least 4 characters</p>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 transition transform active:scale-98 flex items-center justify-center gap-2 mt-2">
                <span id="submitBtnText">Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div id="error" class="hidden mt-4 p-3 bg-rose-950/60 border border-rose-800/60 rounded-xl text-rose-300 text-xs text-center"></div>
        <div id="success" class="hidden mt-4 p-3 bg-emerald-950/60 border border-emerald-800/60 rounded-xl text-emerald-300 text-xs text-center"></div>

        <!-- Default Credentials Helper (Visible only on Sign In tab) -->
        <div id="defaultCredsBox" class="mt-6 pt-5 border-t border-slate-800 text-center">
            <span class="text-[11px] text-slate-500">Default Admin: </span>
            <code class="text-[11px] text-blue-400 font-mono bg-blue-950/60 px-2 py-0.5 rounded border border-blue-900/50">admin@example.com</code>
            <span class="text-[11px] text-slate-500"> / </span>
            <code class="text-[11px] text-blue-400 font-mono bg-blue-950/60 px-2 py-0.5 rounded border border-blue-900/50">admin123</code>
        </div>
    </div>

    <script>
        let currentMode = 'login'; // 'login' or 'register'

        function switchAuthTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const submitBtnText = document.getElementById('submitBtnText');
            const defaultCredsBox = document.getElementById('defaultCredsBox');
            const passwordHint = document.getElementById('passwordHint');
            const emailInput = document.getElementById('authEmail');
            const passInput = document.getElementById('authPassword');
            const errEl = document.getElementById('error');
            const successEl = document.getElementById('success');

            errEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (mode === 'register') {
                tabRegister.className = "flex-1 py-2 text-xs font-bold rounded-lg text-white bg-blue-600 shadow-sm transition";
                tabLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                submitBtnText.textContent = "Create Account & Sign In";
                defaultCredsBox.classList.add('hidden');
                passwordHint.classList.remove('hidden');
                if (emailInput.value === 'admin@example.com') emailInput.value = '';
                if (passInput.value === 'admin123') passInput.value = '';
                emailInput.focus();
            } else {
                tabLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg text-white bg-blue-600 shadow-sm transition";
                tabRegister.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                submitBtnText.textContent = "Sign In to Dashboard";
                defaultCredsBox.classList.remove('hidden');
                passwordHint.classList.add('hidden');
                if (!emailInput.value) emailInput.value = 'admin@example.com';
                if (!passInput.value) passInput.value = 'admin123';
            }
        }

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('submitBtnText');
            const errEl = document.getElementById('error');
            const successEl = document.getElementById('success');

            errEl.classList.add('hidden');
            successEl.classList.add('hidden');
            btn.disabled = true;

            const endpoint = currentMode === 'register' ? '/auth/register' : '/auth/login';
            btnText.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> ${currentMode === 'register' ? 'Creating account...' : 'Signing in...'}`;

            try {
                const formData = new FormData(e.target);
                const res = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    if (currentMode === 'register') {
                        successEl.textContent = "Account created successfully! Loading dashboard...";
                        successEl.classList.remove('hidden');
                    }
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);
                } else {
                    errEl.textContent = data.detail || "Authentication failed. Please check details.";
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                errEl.textContent = "Network error. Please try again.";
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.textContent = currentMode === 'register' ? 'Create Account & Sign In' : 'Sign In to Dashboard';
            }
        };
    </script>
</body>
</html>
